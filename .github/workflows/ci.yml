# EduPortal CI Pipeline
# G50 — CI Quality Gates
#
# Runs on: Pull requests
# Gates: lint → typecheck → test → build
# Fail fast on any failure

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ===========================================================================
  # JOB 1: Quality Gates (runs in parallel)
  # ===========================================================================
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: true
      matrix:
        gate: [lint, typecheck]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      if: matrix.gate == 'lint'
      run: npm run lint
      # Note: warnings are allowed, errors fail the build

    - name: Run TypeScript check
      if: matrix.gate == 'typecheck'
      run: npm run typecheck

  # ===========================================================================
  # JOB 2: Unit & Integration Tests
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test
        DB_PATH: ':memory:'
        DATABASE_URL: ''

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-results/
          playwright-report/
        retention-days: 7

  # ===========================================================================
  # JOB 3: Build
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 1

  # ===========================================================================
  # JOB 4: E2E Tests (runs on main branch push only)
  # ===========================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    # NOTE: Playwright manages both backend and frontend servers automatically
    # via webServer configuration in playwright.config.js
    # Do NOT manually start servers here - it causes double-binding and segfaults

    - name: Run Playwright tests
      run: npm run test:browser
      env:
        NODE_ENV: test
        DB_PATH: ':memory:'
        DATABASE_URL: ''

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
