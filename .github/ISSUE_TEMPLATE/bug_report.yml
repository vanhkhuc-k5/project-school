name: Bug Report
description: Create a bug report to help us improve
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for reporting a bug!

        Please fill out the sections below to help us understand and reproduce the issue.

        **IMPORTANT:** Do not include sensitive information such as passwords, API keys, or personal data.

  - type: dropdown
    id: severity
    attributes:
      label: Bug Severity
      description: How severe is this bug?
      options:
        - Critical (blocks all operations)
        - High (blocks major functionality)
        - Medium (affects some functionality)
        - Low (minor issue, workaround exists)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Authentication
        - Frontend
        - Backend/API
        - Database
        - Tests
        - Documentation
        - CI/CD
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: |
        Example: When I try to login with valid credentials, I get a 500 error instead of being logged in.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: |
        List the steps to reproduce the bug:
        1. Go to '...'
        2. Click on '...'
        3. Enter '...'
        4. See error
      placeholder: |
        1. Navigate to login page
        2. Enter valid credentials
        3. Click submit
        4. See error message
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: |
        Example: I expected to be logged in and redirected to the dashboard.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: |
        Example: I got a 500 error page with the message "Internal Server Error".
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Describe your environment (do NOT include sensitive data):
        - OS/Browser:
        - Node version:
        - Database:
      placeholder: |
        - OS: Windows 11
        - Browser: Chrome 120
        - Node: 18.17.0
        - Database: SQLite (dev)

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Any relevant log output or error messages (do NOT include sensitive data).
      placeholder: |
        ```
        [Error message here]
        ```

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
