# =============================================================================
# EduPortal Nginx Configuration (G53)
# =============================================================================
# Features: Gzip, Static Caching, SSE/WebSocket Support

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging Format
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance Tuning
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # -------------------------------------------------------------------------
    # Gzip Compression (OWASP Recommendation)
    # -------------------------------------------------------------------------
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;

    # Compress these types
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        font/ttf
        font/eot
        font/otf
        image/svg+xml
        image/x-icon;

    # -------------------------------------------------------------------------
    # Buffer Sizes
    # -------------------------------------------------------------------------
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 10m;
    large_client_header_buffers 4 16k;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # -------------------------------------------------------------------------
    # Upstream Backend
    # -------------------------------------------------------------------------
    upstream eduportal_backend {
        server app:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP Server (Redirect to HTTPS in production)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Redirect to HTTPS in production (uncomment when SSL is configured)
        # return 301 https://$server_name$request_uri;

        # Health check endpoint (no caching)
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Root location - serve frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # API Proxy
        location /api/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Connection limiting
            limit_conn addr 20;

            # Proxy to backend
            proxy_pass http://eduportal_backend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # SSE/Streaming endpoint (DISABLE BUFFERING for real-time)
        location /api/notifications/stream {
            # Stricter rate limit for SSE
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass http://eduportal_backend;
            proxy_http_version 1.1;

            # CRITICAL: Disable buffering for SSE
            proxy_buffering off;
            proxy_cache off;
            proxy_store off;
            chunked_transfer_encoding on;

            # Headers for SSE
            proxy_set_header Accept "text/event-stream";
            proxy_set_header Cache-Control "no-cache";
            proxy_set_header Connection "keep-alive";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts for long-lived connections
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # Auth endpoints with stricter rate limiting
        location /api/auth/login {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass http://eduportal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stub for HTTPS (uncomment in production)
        # server {
        #     listen 443 ssl http2;
        #     listen [::]:443 ssl http2;
        #     server_name portal.yourschool.edu.vn;
        #
        #     ssl_certificate /etc/nginx/ssl/cert.pem;
        #     ssl_certificate_key /etc/nginx/ssl/key.pem;
        #     ssl_protocols TLSv1.2 TLSv1.3;
        #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        #     ssl_prefer_server_ciphers off;
        #     ssl_session_cache shared:SSL:10m;
        #     ssl_session_timeout 1d;
        #
        #     # ... same locations as HTTP server above
        # }
    }
}
